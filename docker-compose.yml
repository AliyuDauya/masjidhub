version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: masjidhub-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - JWT_SECRET=${JWT_SECRET:-please_set_a_secure_jwt_secret_in_env}
      - DATABASE_URL=file:/app/prisma/masjidhub.db
      - ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,${ALLOWED_ORIGINS:-}
      - CORS_ORIGIN=http://localhost:3000,http://127.0.0.1:3000
    volumes:
      - sqlite_data:/app/prisma
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5000/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - masjidhub-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: masjidhub-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://backend:5000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - masjidhub-network

volumes:
  sqlite_data:
    driver: local

networks:
  masjidhub-network:
    driver: bridge
